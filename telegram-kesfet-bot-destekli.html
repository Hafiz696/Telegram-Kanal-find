.mm .mr{color:var(--tx);font-weight:600}.mm .mr i{font-style:normal;color:var(--st);margin-right:3px}
.mm .mmm{display:inline-flex;align-items:center}.mm .mi{width:14px;height:14px;margin-right:4px}

/* ===== Arama büyüteci animasyonu ===== */
.sb svg{transform-origin:50% 50%;transition:stroke .2s,transform .25s;animation:mgl 4.8s ease-in-out 1.2s infinite}
@keyframes mgl{0%,62%,100%{transform:translate(0,0) rotate(0) scale(1)}70%{transform:translate(2px,-2px) rotate(14deg) scale(1.12)}78%{transform:translate(-1.5px,1px) rotate(-12deg) scale(1.12)}86%{transform:translate(1px,1px) rotate(8deg) scale(1.08)}93%{transform:translate(0,0) rotate(0) scale(1)}}
.sb:focus-within svg{animation:none;stroke:var(--ac);transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){.sb svg{animation:none}}

/* ===== Detay: profesyonel istatistik şeridi + Güven/Kalite kutuları ===== */
.sc2 .strip{margin:6px 0 20px}
.sc2 .strip>div{display:flex;flex-direction:column;align-items:center}
.sc2 .strip>div:nth-child(2) b::before{content:none}
.si{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;margin-bottom:9px;background:rgba(42,171,238,.13);color:var(--ac2)}
.si svg{width:19px;height:19px;margin:0;stroke-width:2}
.si.st{background:rgba(245,179,1,.15);color:var(--st)}.si.st svg{fill:currentColor}
.sc2 .strip b{font-size:24px}
.gk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.gt{background:var(--card);border-radius:16px;padding:14px 14px 15px}
.gl2{display:block;font-size:12.5px;color:var(--mu);margin-bottom:7px}
.gt b{display:flex;align-items:center;font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.gt b .dot{width:10px;height:10px;margin:0 8px 0 0}
.gt b small{font-size:12.5px;font-weight:500;color:var(--mu);margin-left:2px}
.gg{font-style:normal;font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-left:auto;line-height:1.3}
.gb{height:6px;border-radius:3px;background:var(--bd);overflow:hidden;margin-top:12px}.gb u{display:block;height:100%;border-radius:3px}

/* ===== Detay v3: sade şerit + halka gösterge ===== */
.sc2 .strip{margin:8px 0 22px}
.sc2 .strip>div{display:flex;flex-direction:column;align-items:center;padding:0 4px}
.sc2 .strip b{font-size:26px;font-weight:700;line-height:1.1}
.sc2 .strip span{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:13px;color:var(--mu)}
.sc2 .strip span svg{width:14px;height:14px;margin:0;stroke-width:2.1;color:var(--ac2);flex:none}
.sc2 .strip span svg.sx{color:var(--st);fill:currentColor;stroke-width:1.4}
.tq{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.tqr{position:relative;flex:none;width:76px;height:76px}.tqr svg{width:76px;height:76px;display:block}
.tqb{fill:none;stroke:var(--bd);stroke-width:7}
.tqp{fill:none;stroke-width:7;stroke-linecap:round;animation:tqa .9s ease-out}
@keyframes tqa{from{stroke-dashoffset:214}}
.tqr b{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.tqi{flex:1;min-width:0}
.tqk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px}

.tqv{display:flex;align-items:center;font-weight:650;font-size:14.5px}
.tqg{font-style:normal;font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:1px 7px;margin-left:8px;line-height:1.45}
.tqd{width:9px;height:9px;border-radius:50%;margin-right:7px;display:inline-block}

/* ===== Başlıkta üye sayısı ===== */
.hm{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--mu);margin:0 0 10px}

.tabs div .tn{display:inline-block;margin-left:5px;font-size:12px;font-weight:600;color:var(--mu)}

.tqr b.qn{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;line-height:1}

.qm{flex:1;min-width:0}.qt{font-size:16px;font-weight:700;margin-bottom:9px}
.qp{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:650}

.qg{flex:none;min-width:52px;text-align:center;padding:8px 13px;border-radius:14px;font-size:20px;font-weight:800;line-height:1.1}
.chv{flex:none;width:18px;height:18px;color:var(--mu);stroke-width:2.2}
.ab{padding:16px 16px 6px;border-radius:20px}
.abt{font-size:12px;letter-spacing:.9px;font-weight:700;color:var(--mu);margin-bottom:8px}
.ab .bio{font-size:15px;line-height:1.5}
.abg{margin-top:10px}
.rws{margin-top:12px}
.rw{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--bd);font-size:14.5px}
.rw i{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--mu);font-style:normal}
.rw i svg{width:20px;height:20px;margin:0;stroke-width:1.8}
.rw>span{flex:1;color:var(--mu)}
.rw b{display:flex;align-items:center;gap:8px;font-weight:500;text-align:right}

/* ===== Düzeltmeler: kalite kartı, rozetler, tür simgesi ===== */
.kqt{font-size:15.5px;font-weight:700;line-height:1.2;margin:0 0 8px;background:none;border:0;padding:0}
.qc{gap:14px;padding:14px 16px}
.qc .tqr,.qc .tqr svg{width:64px;height:64px}
.tqr b.qn{font-size:21px}
.qn small{font-size:10.5px;margin-top:2px}
.qp{padding:4px 11px;font-size:12.5px}
.qg{min-width:44px;padding:7px 11px;font-size:17px;border-radius:12px}
.bgs{flex-wrap:wrap;overflow:visible;gap:8px}
